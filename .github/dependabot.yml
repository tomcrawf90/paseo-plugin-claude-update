version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # These follow the Paseo version the plugin supports (AGENTS.md,
      # "Releases"), not the newest one.
      - dependency-name: "@getpaseo/plugin"
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: "@types/react"
      # Typed for the oldest Node in engines (">=22"), so code using a newer
      # Node's API fails the typecheck. Raise the major with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
