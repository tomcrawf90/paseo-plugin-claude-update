name: Release

# Pushing a tag vX.Y.Z publishes that version: it is verified, published to npm
# and given a GitHub release, in that order. RELEASING.md has the whole flow.
# npm names this file (release.yml) as the package's trusted publisher, so
# renaming it means changing that setting on npmjs.com too.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

# One release at a time, and never cancelled halfway through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Releases are tagged from main."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require the tag to match package.json and a dated CHANGELOG.md entry
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"
      - name: Require the version to be new on npm
        run: node scripts/release.mjs unpublished
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP/release")"
          version="$(node -p "require('./package.json').version")"
          node scripts/release.mjs notes > "$RUNNER_TEMP/release/notes.md"
          (cd "$RUNNER_TEMP/release" && sha256sum "$tarball")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball the job above packed. No dependency is installed and
  # no package script runs in this job, which is the only one that can publish.
  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing, and the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require an npm that can do trusted publishing
        run: |
          echo "npm $(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("::error::npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing needs"); process.exit(1); }
          ' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # Again, right before publishing: a re-run of this job must not publish twice.
      - name: Require the version to be new on npm
        run: node scripts/release.mjs unpublished
      - name: Publish
        env:
          # Empty unless the fallback secret exists. npm tries trusted
          # publishing first and uses the token only if that is not set up.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ runner.temp }}/release/${{ needs.verify.outputs.tarball }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "An NPM_TOKEN secret is set; it is used if trusted publishing is not configured."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret; publishing depends on npm trusted publishing."
          fi
          if ! npm publish "$TARBALL" --access public --provenance; then
            echo "::error title=npm publish failed::Nothing was published. If npm refused the credentials: the package needs this repository and release.yml as its trusted publisher on npmjs.com, or (for the first release, before the package exists) a granular token in the NPM_TOKEN repository secret. See RELEASING.md."
            exit 1
          fi

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Create the release with the published tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          TARBALL: ${{ runner.temp }}/release/${{ needs.verify.outputs.tarball }}
          NOTES: ${{ runner.temp }}/release/notes.md
        run: |
          # Safe to re-run: the release is made once, after the npm publish.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          echo "Released $VERSION: https://github.com/$GH_REPO/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
